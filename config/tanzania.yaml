# Tanzania deployment — documentation (non-test) classifiers.
documentation:
  panels:
    - ARTID
    - EIDID
    - VLID
  params: []
  forms:
    ARTID: hiv_art_documentation
    EIDID: eid_documentation
    VLID: hiv_vl_documentation

# TESTDATA_STATUS blob header layout. Bytes 0-79 are a header; 80+ is the
# result payload. `end` is EXCLUSIVE. These are MEASURED, not guessed — run
# `cdr probe-review` against this deployment's DISA + v1 before changing them.
# Measured 2026-08-02 against 176,287 labelled panels (DisalabData.TESTDATA
# joined to OpenLDR v1 Requests): the initials rule scores 98.91%, and
# long-datetime at offset 21 reproduces AuthorisedDateTime to the minute on
# 159,340/160,371 rows (99.36%).
disa_blob_offsets:
  reviewer_initials: { start: 77, end: 80 }
  reviewed_at: { start: 21, kind: long-datetime }
  # Measured 2026-09-29 against OpenLDR v1 Requests (TZDISAT%), see openldr_ce
  # docs/superpowers/specs/2026-09-29-v1-request-facts-disa-sources.md.
  # analysis_at: 169,844 match, 0 mismatch. analyzer_code: 170,465 agree, 0 mismatch.
  # tester_initials: initials match; 4% of names differ because USERDIC6 changed.
  analysis_at: { start: 15, kind: long-datetime }
  analyzer_code: { start: 56, end: 61 }
  tester_initials: { start: 74, end: 77 }

# Measured 2026-09-29 against OpenLDR v1 Requests (TZDISAT%), same spec as above.
disa_registration_offsets:
  request_type: { offset: 333, values: { 0: D, 8: E } }  # 93,161 D and 5,098 E, no exceptions
  age_years: { offset: 414 }                             # equals v1 AgeInYears on every row
  age_days: { offset: 417 }                              # 417-418 little-endian, equals v1 AgeInDays
  newborn: { offset: 409, mask: 2 }                      # 3 of 3 v1 newborns; thin base

# PARMDICT_STATUS reporting limits, float32 little-endian. 0 means no limit.
# Measured 2026-09-30 on Tanzania PARMDICT (HIVVM 10,000,000 / 20, HIVVQ 3,000,000 / 40, HIVTL 6.7 / 0).
disa_parmdict_offsets: { high_limit: 103, low_limit: 107 }

# TESTDICT.SECTION letter to v1 HL7SectionCode. "" is a blank section.
hl7_section_codes:
  V: VR
  S: SR
  C: CH
  M: MB
  H: HM
  P: PAR
  B: BLB
  L: OTH
  G: OTH
  HT: OTH
  TB: OTH
  "": OTH
